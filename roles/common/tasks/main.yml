- name: Install SSHD
  apt:
    name:
      - openssh-server
    state: present

- name: Add SSH keys
  get_url:
    url: https://danhughes.dev/keys
    dest: /home/{{ ansible_user }}/.ssh/authorized_keys
    mode: 0644

- name: Add {{ ansible_user }} to the sudoers
  copy:
    dest: "/etc/sudoers.d/{{ ansible_user }}"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL"
    mode: 0440

- name: Disable password-only SSH
  notify:
    - restart ssh
  copy:
    dest: /etc/ssh/sshd_config.d/password_authentication.conf
    content: |
      PasswordAuthentication no

- name: Disable root SSH
  notify:
    - restart ssh
  copy:
    dest: /etc/ssh/sshd_config.d/permit_root_login.conf
    content: |
      PermitRootLogin no

- name: Enable user lingering
  command: "loginctl enable-linger {{ ansible_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_user }}"

- name: Configure weekly reboot on Sunday at 2-3am
  cron:
    name: "regular_reboot"
    cron_file: "regular_reboot"
    weekday: "0"
    minute: "{{ 60 |random(seed=inventory_hostname) }}"
    hour: "2"
    user: root
    job: "/sbin/reboot >/dev/null 2>&1"

- name: Hush login
  copy:
    content: ""
    dest: "/home/{{ ansible_user }}/.hushlogin"
    force: false

- name: Update and upgrade apt packages
  become: true
  apt:
    cache_valid_time: 86400 # 1 day
    update_cache: yes
    upgrade: yes
    autoremove: yes
    clean: yes

# Cluster-only: pin the resolver to the cluster DNS VIP and ignore DHCP-provided
# servers, so lease renewals can't mix resolvers with divergent knowledge of
# internal names (the dns stack serves *.danhughes.dev; the router cannot).
# Netplan UNIONS nameserver lists across files (no override), so the cloud-init
# file's 10.10.10.1 must be stripped at the source; 99-dns.yaml carries the
# replacement plus the dhcp4-overrides switch. See dns stack docs for tradeoffs.
- name: Remove cloud-init resolver pin
  become: true
  when: resolver_dns is defined
  replace:
    dest: /etc/netplan/50-cloud-init.yaml
    regexp: '\n *nameservers:\n *addresses:\n *- 10\.10\.10\.1\n'
    replace: '\n'
  notify: netplan apply

- name: Pin cluster DNS resolver
  become: true
  when: resolver_dns is defined
  copy:
    dest: /etc/netplan/99-dns.yaml
    mode: "0600"
    content: |
      network:
        version: 2
        ethernets:
          enp1s0:
            nameservers:
              addresses: [{{ resolver_dns }}]
            dhcp4-overrides:
              use-dns: false
  notify: netplan apply

# Deploy list for doco-cd. Every stack is an explicit document here while the
# migration from stacks/deploy.sh is staged; `pause: true` holds each back
# until it is migrated and verified. When all are live this file collapses to a
# single document with auto_discover over stacks/ (see
# docs/superpowers/specs/2026-10-24-doco-cd-auto-deploy-design.md).
name: pairdrop
working_dir: stacks/pairdrop
# Concurrent deployments can overlap prune jobs; node timers own image cleanup.
prune_images: false
environment:
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/London

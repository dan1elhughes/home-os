services:
  doco-cd:
    # Pinned tag; Renovate manages this like every other image.
    image: ghcr.io/kimdre/doco-cd:0.130.0
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
      SECRET_PROVIDER: "1password"
      SECRET_PROVIDER_ACCESS_TOKEN_FILE: /run/secrets/doco_cd_sa_token
      # doco-cd only sends when the urls field is non-empty (Notifier.configured),
      # so the same destination is passed alongside the named key. Apprise
      # de-duplicates identical URLs, so this still delivers exactly once.
      # Bare service name: Django's ALLOWED_HOSTS rejects underscores in
      # hostnames, so "apprise_apprise" would 400 as an invalid HTTP_HOST.
      APPRISE_API_URL: http://apprise:8000/notify/deploys
      APPRISE_NOTIFY_URLS: ${APPRISE_NOTIFY_URLS?error}
      APPRISE_NOTIFY_LEVEL: success
      # Deployment outcomes are reported to GitHub via a dedicated PAT stored
      # as GIT_STATUS_TOKEN (commit statuses: read and write).
      GIT_ACCESS_TOKEN: ${GIT_ACCESS_TOKEN?error}
      GIT_COMMIT_STATUS: "true"
      # No inline deployments: the repo's own .doco-cd.yml owns the staged
      # migration, so un-pausing a stack is an ordinary commit.
      POLL_CONFIG: |
        - url: https://github.com/dan1elhughes/home-os.git
          reference: refs/heads/master
          interval: 5m
    secrets:
      - doco_cd_sa_token
    networks:
      - main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - doco_data:/data
    deploy:
      placement:
        constraints:
          - node.role == manager

secrets:
  doco_cd_sa_token:
    external: true

networks:
  main:
    external: true

volumes:
  doco_data:

server:
    directory: "/opt/unbound/etc/unbound"
    interface: 10.10.10.20
    ip-freebind: yes
    access-control: 127.0.0.0/8 allow
    access-control: 10.10.10.0/24 allow
    # Docker bridge sources: queries from containers on the node holding the
    # VIP are NOT masqueraded (10.10.10.20 is a local address there, so no
    # NAT) and arrive with their bridge source. Allow the full Docker default
    # pool range (172.16/12) so drift in docker0/docker_gwbridge allocation
    # can't silently break container DNS.
    access-control: 172.16.0.0/12 allow
    cache-max-ttl: 300
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
    username: "_unbound"
    do-daemonize: no
    include: "/opt/unbound/etc/unbound/runtime/hosts.conf"
include: "/opt/unbound/etc/unbound/runtime/forward.conf"
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

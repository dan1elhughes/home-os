server:
    directory: "/opt/unbound/etc/unbound"
    interface: 0.0.0.0
    port: 5353
    # Overlay-only: AdGuard queries arrive from the `main` subnet
    # (10.0.1.0/24); everything else is refused.
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.1.0/24 allow
    # No v6 route from the overlay network; do not stall on v6 upstreams.
    do-ip6: no
    cache-max-ttl: 300
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
    username: "_unbound"
    do-daemonize: no
    include: "/opt/unbound/etc/unbound/runtime/hosts.conf"
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

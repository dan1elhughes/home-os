services:
  unbound:
    image: mvance/unbound:1.22.0@sha256:76906da36d1806f3387338f15dcf8b357c51ce6897fb6450d6ce010460927e90
    entrypoint: ["/bin/sh", "/run/dns/entrypoint.sh"]
    environment:
      NEXTDNS_PROFILE_ID: ${NEXTDNS_PROFILE_ID?error}
    networks: [host]
    volumes:
      - /mnt/cephfs/dns:/opt/unbound/etc/unbound/generated:ro
      - dns_trust_anchor:/opt/unbound/etc/unbound/var
    configs:
      - source: unbound
        target: /opt/unbound/etc/unbound/unbound.conf
      - source: entrypoint
        target: /run/dns/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "unbound-control -c /opt/unbound/etc/unbound/unbound.conf status && unbound-control -c /opt/unbound/etc/unbound/unbound.conf list_local_data | grep -xEq 'home[.]danhughes[.]dev[.][[:space:]]+[0-9]+[[:space:]]+IN[[:space:]]+A[[:space:]]+10[.]10[.]10[.]20'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: global

  generator:
    image: python:3.13-alpine@sha256:f3ebba2ace255c93267a0278da88c7f1044432991abc4e6ad20d22e34dd0f8ee
    entrypoint: ["python", "/run/dns/generator.py"]
    networks: [default]
    environment:
      TRAEFIK_API_URL: http://traefik:8080/api/http/routers
      RECORDS_PATH: /data/hosts.conf
      TRAEFIK_IP: 10.10.10.20
    volumes:
      - /mnt/cephfs/dns:/data
    configs:
      - source: generator
        target: /run/dns/generator.py
    deploy:
      replicas: 1

networks:
  host:
    external: true
    name: host
  default:
    external: true
    name: main

volumes:
  dns_trust_anchor:
    driver: local

configs:
  unbound:
    name: dns_unbound_${DNS_CONFIG_HASH?error}
    file: ./unbound.conf
  entrypoint:
    name: dns_entrypoint_${DNS_CONFIG_HASH?error}
    file: ./entrypoint.sh
  generator:
    name: dns_generator_${DNS_CONFIG_HASH?error}
    file: ./generator.py

services:
  unbound:
    image: mvance/unbound:1.22.0
    entrypoint: ["/bin/sh", "/run/dns/entrypoint.sh"]
    networks: [default]
    volumes:
      - /mnt/nas/dns:/opt/unbound/etc/unbound/generated:ro
      - dns_trust_anchor:/opt/unbound/etc/unbound/var
    configs:
      - source: unbound
        target: /opt/unbound/etc/unbound/unbound.conf
      - source: entrypoint
        target: /run/dns/entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "unbound-control -c /opt/unbound/etc/unbound/unbound.conf status && unbound-control -c /opt/unbound/etc/unbound/unbound.conf list_local_data | grep -xEq 'home[.]danhughes[.]dev[.][[:space:]]+[0-9]+[[:space:]]+IN[[:space:]]+A[[:space:]]+10[.]10[.]10[.]20'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: global

  adguard:
    image: adguard/adguardhome:v0.107.79
    entrypoint: ["/bin/sh", "/run/dns/adguard-entrypoint.sh"]
    networks: [default]
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - adguard_conf:/opt/adguardhome/conf
      - adguard_work:/opt/adguardhome/work
    configs:
      - source: adguard
        target: /run/dns/AdGuardHome.yaml
      - source: adguard-entrypoint
        target: /run/dns/adguard-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "nslookup home.danhughes.dev 127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      mode: global
      labels:
        # Service-level labels: the Traefik swarm provider reads Spec.Labels,
        # not container labels, and needs the network hint.
        - "traefik.enable=true"
        - "traefik.swarm.network=main"
        - "traefik.http.routers.adguard.rule=Host(`adguard.danhughes.dev`)"
        - "traefik.http.routers.adguard.entrypoints=websecure"
        - "traefik.http.routers.adguard.tls=true"
        - "traefik.http.routers.adguard.tls.certResolver=letsencrypt"
        - "traefik.http.services.adguard.loadbalancer.server.port=3000"
        # AutoKuma monitors: one through the whole client path (VIP -> mesh ->
        # adguard -> unbound -> roots, DNSSEC-signed name), one for the UI
        # process itself. Kuma's DNS monitor: `hostname` is the DOMAIN to
        # resolve, `dns_resolve_server` is the DNS server to query.
        - "kuma.adguard-dns.dns.name=AdGuard DNS"
        - "kuma.adguard-dns.dns.hostname=example.com"
        - "kuma.adguard-dns.dns.port=53"
        - "kuma.adguard-dns.dns.dns_resolve_type=A"
        - "kuma.adguard-dns.dns.dns_resolve_server=10.10.10.20"
        - "kuma.adguard-ui.http.name=AdGuard UI"
        - "kuma.adguard-ui.http.url=http://adguard:3000"
        - 'kuma.adguard-ui.http.accepted_statuscodes=["200-299","302"]'

  generator:
    image: python:3.13-alpine
    entrypoint: ["python", "/run/dns/generator.py"]
    networks: [default]
    environment:
      TRAEFIK_API_URL: http://traefik:8080/api/http/routers
      RECORDS_PATH: /data/hosts.conf
      TRAEFIK_IP: 10.10.10.20
    volumes:
      - /mnt/nas/dns:/data
    configs:
      - source: generator
        target: /run/dns/generator.py
    deploy:
      replicas: 1

networks:
  default:
    external: true
    name: main

volumes:
  dns_trust_anchor:
    driver: local
  adguard_conf:
    driver: local
  adguard_work:
    driver: local

configs:
  unbound:
    name: dns_unbound_${DNS_CONFIG_HASH?error}
    file: ./unbound.conf
  entrypoint:
    name: dns_entrypoint_${DNS_CONFIG_HASH?error}
    file: ./entrypoint.sh
  generator:
    name: dns_generator_${DNS_CONFIG_HASH?error}
    file: ./generator.py
  adguard:
    name: dns_AdGuardHome_${DNS_CONFIG_HASH?error}
    file: ./AdGuardHome.yaml
  adguard-entrypoint:
    name: dns_adguard-entrypoint_${DNS_CONFIG_HASH?error}
    file: ./adguard-entrypoint.sh

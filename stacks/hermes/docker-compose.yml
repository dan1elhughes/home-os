services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.2
    # The image entrypoint (s6 /init) must stay: it drops to the hermes user
    # and reaps the processes MCP and tools leave behind.
    command: gateway run
    environment:
      # The NAS export maps every file to 1000, so the hermes user (10000 by
      # default) is remapped to match.
      - PUID=${PUID?error}
      - PGID=${PGID?error}
      - TZ=${TZ?error}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN?error}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY?error}
      - HERMES_MCPJUNGLE_TOKEN=${HERMES_MCPJUNGLE_TOKEN?error}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS?error}
      - TELEGRAM_FAMILY_CHAT=${TELEGRAM_FAMILY_CHAT?error}
      - TELEGRAM_ADMIN_USER=${TELEGRAM_ADMIN_USER?error}
      # The dashboard refuses a non-loopback bind without a sign-in provider.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_PUBLIC_URL=https://hermes.danhughes.dev
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=dan
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD?error}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET?error}
    volumes:
      - "/mnt/nas/hermes-data:/opt/data"
    configs:
      - source: hermes_managed_config
        target: /etc/hermes/config.yaml
        mode: 0444
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.hermes.rule=Host(`hermes.danhughes.dev`)"
        - "traefik.http.routers.hermes.entrypoints=websecure"
        - "traefik.http.routers.hermes.tls=true"
        - "traefik.http.routers.hermes.tls.certResolver=letsencrypt"
        - "traefik.http.services.hermes.loadbalancer.server.port=9119"
        - "traefik.swarm.network=main"
        - "kuma.hermes.http.name=Hermes"
        - "kuma.hermes.http.url=https://hermes.danhughes.dev/"

networks:
  default:
    external: true
    name: main

configs:
  # doco-cd names each object with a content-hash suffix, so a change here
  # rolls the service with the new file.
  hermes_managed_config:
    file: ./managed/config.yaml

---
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.4.0
    environment:
      - TZ=${TZ?error}
      # External MariaDB backend. With these set on first boot (data dir has
      # no kuma.db yet), Kuma auto-connects and skips the interactive setup
      # screen. Stack is local-only, so simple shared credentials are fine.
      - UPTIME_KUMA_DB_TYPE=mariadb
      - UPTIME_KUMA_DB_HOSTNAME=mariadb
      - UPTIME_KUMA_DB_PORT=3306
      - UPTIME_KUMA_DB_NAME=kuma
      - UPTIME_KUMA_DB_USERNAME=mariadb
      - UPTIME_KUMA_DB_PASSWORD=mariadb
    volumes:
      - "/mnt/cephfs/uptime-kuma:/app/data"
    depends_on:
      - mariadb
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`uptime-kuma.danhughes.dev`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
        - "traefik.http.routers.uptime-kuma.tls=true"
        - "traefik.http.routers.uptime-kuma.tls.certResolver=letsencrypt"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
        - "traefik.swarm.network=main"
        # AutoKuma self-monitor: create a monitor for Uptime Kuma itself.
        - "kuma.uptime-kuma.http.name=Uptime Kuma"
        - "kuma.uptime-kuma.http.url=https://uptime-kuma.danhughes.dev"

  autokuma:
    image: ghcr.io/bigboot/autokuma:latest
    environment:
      - TZ=${TZ?error}
      # No auth on Uptime Kuma, so just the URL is needed.
      - AUTOKUMA__KUMA__URL=http://uptime-kuma:3001
      # Read swarm *service* labels (deploy.labels), same place Traefik reads.
      - AUTOKUMA__DOCKER__ENABLED=true
      - AUTOKUMA__DOCKER__SOURCE=Services
      - AUTOKUMA__DOCKER__HOSTS=unix:///var/run/docker.sock
      - AUTOKUMA__DOCKER__LABEL_PREFIX=kuma
      # Delete monitors when their kuma.* labels disappear from a service.
      - AUTOKUMA__ON_DELETE=delete
      # Assign the "Apprise (Slack)" notification (DB id 1) to all HTTP monitors.
      - 'AUTOKUMA__DEFAULT_SETTINGS=http.notificationIDList: {"1": true}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "/mnt/cephfs/autokuma-data:/data"
    deploy:
      placement:
        constraints:
          - node.role == manager

  mariadb:
    image: mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=mariadb
      - MARIADB_DATABASE=kuma
      - MARIADB_USER=mariadb
      - MARIADB_PASSWORD=mariadb
      - TZ=${TZ?error}
    volumes:
      - "/mnt/cephfs/uptime-kuma-mariadb:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    external: true
    name: main

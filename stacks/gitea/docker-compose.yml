services:
  gitea:
    image: docker.gitea.com/gitea:1.27
    environment:
      - USER_UID=${PUID?error}
      - USER_GID=${PGID?error}
      - GITEA__database__DB_TYPE=postgres
      # TrueNAS database app (see truenas-databases/). Gitea shares the
      # Postgres image family but has its own instance and host port.
      - GITEA__database__HOST=10.10.10.60:5434
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
    volumes:
      - "/mnt/nas/gitea-config:/data"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.gitea.rule=Host(`gitea.danhughes.dev`)"
        - "traefik.http.routers.gitea.entrypoints=websecure"
        - "traefik.http.routers.gitea.tls=true"
        - "traefik.http.routers.gitea.tls.certResolver=letsencrypt"
        - "traefik.http.services.gitea.loadbalancer.server.port=3000"
        - "traefik.swarm.network=main"
        - "kuma.gitea.http.name=Gitea"
        - "kuma.gitea.http.url=https://gitea.danhughes.dev/api/healthz"

networks:
  default:
    external: true
    name: main
